[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hoverslam"
version = "1.0.0"
description = "Autonomous VTVL rocket landing Gymnasium environment with pure-Python physics and PPO reinforcement learning."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "Syed Muhammad Taqi Kazmi", email = "94923355+Mackming@users.noreply.github.com" },
]
keywords = [
    "hoverslam",
    "vtvl",
    "reinforcement-learning",
    "gymnasium",
    "ppo",
    "stable-baselines3",
    "pygame",
    "physics-simulation",
    "deep-reinforcement-learning",
    "continuous-control",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Games/Entertainment :: Simulation",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "gymnasium>=0.29.0",
    "numpy>=1.24.0",
    "pygame>=2.5.0",
    "stable-baselines3[extra]>=2.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "ruff>=0.1.0",
]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py39"
